<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120d1d"><link rel="manifest" href="manifest.webmanifest"><title>Luna • IA Companheira</title><style>
*{box-sizing:border-box}body{margin:0;background:#08070d;color:#f7f3ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px}.brand{display:flex;gap:10px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#a65cff,#30204b);display:grid;place-items:center;font-size:26px;border:2px solid #b16bff}.online{font-size:12px;color:#82efaa}.scene{height:260px;border-radius:25px;position:relative;overflow:hidden;border:1px solid #342447;background:radial-gradient(circle at 50% 30%,#3b2558,#171221 58%,#09080d)}.city{position:absolute;bottom:0;left:0;right:0;height:38%;background:linear-gradient(#15101e,#09080e)}.city:before{content:'▦ ▦ ▦ ▦ ▦ ▦ ▦ ▦';position:absolute;bottom:28px;left:10%;right:10%;font-size:35px;letter-spacing:14px;opacity:.25}.funko{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:155px;height:190px}.hair{position:absolute;inset:8px 12px 45px;background:#17131f;border-radius:55% 55% 42% 42%;box-shadow:inset -9px -7px #342341}.face{position:absolute;left:23px;right:23px;top:35px;height:112px;border-radius:48%;background:#e8b08f;box-shadow:0 4px #c98971}.eye{position:absolute;top:63px;width:29px;height:36px;border-radius:50%;background:#17131e}.eye:after{content:'';position:absolute;left:6px;top:6px;width:8px;height:9px;border-radius:50%;background:#fff}.e1{left:39px}.e2{right:39px}.hood{position:absolute;left:19px;right:19px;bottom:0;height:74px;background:#211a2d;border-radius:35px 35px 12px 12px;border:2px solid #54366b}.phones{position:absolute;left:4px;right:4px;top:31px;height:90px;border:7px solid #a75cff;border-bottom-color:transparent;border-radius:70px}.chat{display:flex;flex-direction:column;gap:9px;padding:12px 2px}.messages{max-height:48vh;overflow:auto}.bubble{max-width:88%;padding:11px 14px;border-radius:18px;margin:7px 0;white-space:pre-wrap}.ai{background:#15121d;border:1px solid #30243d}.me{margin-left:auto;background:#5d2ca0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.controls button,.send{min-height:46px;border-radius:14px;border:1px solid #3a2b4c;background:#13101a;color:#fff}.controls button:active,.send:active{transform:scale(.98)}form{display:flex;gap:8px;margin-top:8px}input{min-width:0;flex:1;border-radius:16px;border:1px solid #392b48;background:#110e17;color:#fff;padding:13px 14px;font-size:16px}.send{width:54px;background:#6c32b7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.card{border:1px solid #2d2238;border-radius:15px;padding:10px;background:#0f0c14;font-size:13px}.muted{color:#a99fb5;font-size:12px}.typing{color:#b9a9c7;font-size:13px;padding:3px 12px;display:none}@media(max-width:390px){.scene{height:235px}.controls{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><div class="top"><div class="brand"><div class="avatar">🌙</div><div><b>Luna</b><div class="online">● Online</div></div></div><div>💜 <span id="level">Nv. 1</span></div></div><section class="scene"><div class="city"></div><div class="funko"><div class="hair"></div><div class="phones"></div><div class="face"><div class="eye e1"></div><div class="eye e2"></div></div><div class="hood"></div></div></section><section class="chat"><div id="messages" class="messages"><div class="bubble ai">Oi. 💜 Eu sou a Luna. Agora meu cérebro é uma IA de verdade — não apenas respostas programadas.</div><div class="bubble ai">Pode falar comigo normalmente. Eu vou acompanhar o contexto da nossa conversa.</div></div><div id="typing" class="typing">Luna está pensando…</div><div class="controls"><button data-q="Vamos conversar">💬 Conversar</button><button data-q="Me surpreenda">🎁 Surpresa</button><button data-q="Vamos brincar">🎮 Brincar</button><button data-q="Como é sua personalidade?">✨ Personalidade</button><button data-q="Quero um momento tranquilo">🌙 Momento</button><button data-q="O que você lembra desta conversa?">🧠 Memória</button></div><form id="form"><input id="input" maxlength="4000" autocomplete="off" placeholder="Fale com a Luna…"><button class="send">➤</button></form></section><section class="stats"><div class="card"><div class="muted">PERSONALIDADE</div>Carinhosa • curiosa • brincalhona</div><div class="card"><div class="muted">CÉREBRO</div>GPT • conversa contextual</div></section></main><script>
const $=s=>document.querySelector(s),messages=$('#messages'),input=$('#input'),typing=$('#typing');let previous=null;function add(t,c){const d=document.createElement('div');d.className='bubble '+c;d.textContent=t;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}async function send(text){text=text.trim();if(!text)return;add(text,'me');input.value='';typing.style.display='block';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,previous_response_id:previous})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');previous=j.response_id;add(j.text,'ai')}catch(e){add('Não consegui falar com meu cérebro agora. Verifique se o servidor está conectado à API.','ai')}finally{typing.style.display='none'}}$('#form').addEventListener('submit',e=>{e.preventDefault();send(input.value)});document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.q)));
</script></body></html>
